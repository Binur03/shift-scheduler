<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Shift Scheduler{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  {% block nav %}
  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-6">
      <span class="font-semibold text-slate-900">Shift Scheduler</span>
      <a href="{{ url_for('admin.list_shifts') }}" class="text-sm text-slate-600 hover:text-slate-900">Shifts</a>
      <a href="{{ url_for('admin.list_jobs') }}" class="text-sm text-slate-600 hover:text-slate-900">Jobs</a>
      <a href="{{ url_for('admin.list_employees') }}" class="text-sm text-slate-600 hover:text-slate-900">Employees</a>
      <form method="post" action="{{ url_for('auth.logout') }}" class="ml-auto">
        <button class="text-sm text-slate-500 hover:text-slate-900">Log out</button>
      </form>
    </div>
  </nav>
  {% endblock %}

  <main class="max-w-6xl mx-auto px-4 py-8">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for category, message in messages %}
            <div class="rounded-md px-4 py-2 text-sm
              {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
              {{ message }}
            </div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
