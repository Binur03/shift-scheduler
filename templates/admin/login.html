<!DOCTYPE html>
<html lang="{{ current_language() }}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ t("Log in") }} · Shift Scheduler</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } }
    };
  </script>
</head>
<body class="min-h-screen antialiased bg-slate-100 flex items-center justify-center px-4
             bg-[radial-gradient(ellipse_at_top,_rgba(99,102,241,0.15),_transparent_60%)]">
  <div class="max-w-sm w-full">
    <div class="flex justify-center mb-4">
      {% include "_language_toggle.html" %}
    </div>

    <div class="flex flex-col items-center mb-6">
      <span class="w-14 h-14 rounded-2xl bg-gradient-to-br from-indigo-600 to-violet-600 shadow-lg shadow-indigo-600/30 flex items-center justify-center mb-3">
        <svg class="w-7 h-7 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5" />
        </svg>
      </span>
      <h1 class="text-xl font-bold text-slate-900 tracking-tight">Shift Scheduler</h1>
      <p class="text-base text-slate-500">{{ t("Sign in to the admin console") }}</p>
    </div>

    <div class="bg-white rounded-2xl shadow-xl shadow-slate-900/5 border border-slate-200 p-8">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="mb-4 flex items-start gap-2.5 rounded-xl px-4 py-3 text-sm
            {{ 'bg-emerald-50 border border-emerald-200 text-emerald-800' if category == 'success' else 'bg-rose-50 border border-rose-200 text-rose-800' }}">
            <span>{{ message }}</span>
          </div>
        {% endfor %}
      {% endwith %}

      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}" />
        <label class="block text-sm font-medium text-slate-700 mb-1.5" for="password">{{ t("Admin password") }}</label>
        <input id="password" name="password" type="password" required autofocus
               class="w-full border border-slate-300 rounded-lg px-3.5 py-2.5 text-sm mb-5 focus:outline-none focus:ring-2 focus:ring-indigo-500/40 focus:border-indigo-500" />
        <button class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 text-white rounded-lg px-4 py-2.5 text-sm font-semibold hover:bg-indigo-500 shadow-sm shadow-indigo-600/30 transition">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" /></svg>
          {{ t("Sign in") }}
        </button>
      </form>
    </div>
    <p class="text-center text-xs text-slate-400 mt-6">{{ t("Workforce dispatch & scheduling") }}</p>
  </div>
</body>
</html>
