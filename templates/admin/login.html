<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Shift Scheduler</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 max-w-sm w-full p-8">
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Shift Scheduler</h1>
    <p class="text-slate-500 text-sm mb-6">Admin sign in</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="mb-4 rounded-md px-4 py-2 text-sm
          {{ 'bg-green-100 text-green-800' if category == 'success' else 'bg-red-100 text-red-800' }}">
          {{ message }}
        </div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <input type="hidden" name="next" value="{{ request.args.get('next', '') }}" />
      <label class="block text-sm text-slate-600 mb-1" for="password">Password</label>
      <input id="password" name="password" type="password" required autofocus
             class="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mb-4" />
      <button class="w-full bg-slate-900 text-white rounded-md px-4 py-2 text-sm hover:bg-slate-700">
        Sign in
      </button>
    </form>
  </div>
</body>
</html>
