<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 max-w-md w-full p-8 text-center">
    <div class="w-14 h-14 rounded-full bg-amber-100 text-amber-700 flex items-center justify-center mx-auto mb-4 text-2xl">!</div>
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Something went wrong</h1>
    <p class="text-slate-500 text-sm">
      Sorry — an unexpected error occurred. Please try again in a moment,
      or contact your coordinator if it keeps happening.
    </p>
  </div>
</body>
</html>
