{% extends "worker/_layout.html" %}
{% block title %}Something went wrong · Shift Scheduler{% endblock %}
{% block card %}
<div class="h-1.5 bg-gradient-to-r from-rose-400 to-orange-400"></div>
<div class="p-7 text-center">
  <div class="w-16 h-16 rounded-full bg-rose-50 flex items-center justify-center mx-auto mb-4">
    <svg class="w-8 h-8 text-rose-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z" /></svg>
  </div>
  <h1 class="text-xl font-bold text-slate-900 tracking-tight mb-1">Something went wrong</h1>
  <p class="text-sm text-slate-500">
    We hit an unexpected error. Please try again in a moment — if it keeps
    happening, contact your coordinator.
  </p>
</div>
{% endblock %}
