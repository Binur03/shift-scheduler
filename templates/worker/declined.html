<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Response recorded</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 max-w-md w-full p-8 text-center">
    <div class="w-14 h-14 rounded-full bg-slate-100 text-slate-500 flex items-center justify-center mx-auto mb-4 text-2xl">✓</div>
    <h1 class="text-xl font-semibold text-slate-900 mb-1">Thanks, {{ assignment.employee.first_name }}</h1>
    <p class="text-slate-500 text-sm">
      You're marked as <span class="font-medium text-slate-700">not available</span> for
      {{ shift.job.title }} on {{ shift.date }}
      ({{ shift.start_time.strftime('%H:%M') }}–{{ shift.end_time.strftime('%H:%M') }}).
      If your availability changes, contact your coordinator.
    </p>
  </div>
</body>
</html>
